<!-- Modal Bootstrap reutilizable para confirmar eliminación vía POST con CSRF -->
<div class="modal fade" id="modalEliminarPlato" tabindex="-1" aria-labelledby="modalEliminarTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header text-white" style="background-color: var(--color-burdeos);">
                <h5 class="modal-title titulo-restaurante" id="modalEliminarTitulo">Confirmar eliminación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2">
                    ¿Estás seguro de que deseas eliminar el plato
                    <strong id="modalNombrePlato">seleccionado</strong> de la carta?
                </p>
                <p class="text-muted small mb-0">Esta acción quitará el registro permanentemente de la base de datos.</p>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form id="formEliminarPlato" method="post" action="">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Sí, eliminar plato</button>
                </form>
            </div>
        </div>
    </div>
</div>
